[package]
name = "audiomatrix_rust_core"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Zero-allocation cross-platform DSP, lock-free SPSC ring buffer, WAV/OSC codec, and OS audio backend abstraction for AudioMatrixHub"

[lib]
name = "audiomatrix_rust_core"
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
