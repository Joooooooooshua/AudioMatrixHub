name: Cross-Platform Build, Test & Release Artifacts CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-x64:
    name: Linux (PipeWire + Rust eframe GUI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install X11 / Wayland / OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev libwayland-dev pkg-config

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust Core (PipeWire driver + DSP + RingBuffer)
        run: cargo test --release --manifest-path rust-core/Cargo.toml

      - name: Build Linux Desktop GUI & CLI
        run: cargo build --release --manifest-path rust-desktop/Cargo.toml

      - name: Run cross-platform self-test suite
        run: ./rust-desktop/target/release/audiomatrix-pc self-test

      - name: Package Linux Release Tarball
        run: |
          mkdir -p dist/linux
          cp rust-desktop/target/release/audiomatrix-desktop rust-desktop/target/release/audiomatrix-pc README.md README.zh-CN.md LICENSE dist/linux/
          tar -czf AudioMatrixHub-v2.0.0-Linux-x64.tar.gz -C dist/linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioMatrixHub-v2.0.0-Linux-x64
          path: AudioMatrixHub-v2.0.0-Linux-x64.tar.gz

  windows-x64:
    name: Windows (WASAPI + Rust eframe GUI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust Core (WASAPI driver + DSP + RingBuffer)
        run: cargo test --release --manifest-path rust-core/Cargo.toml

      - name: Build Windows Desktop GUI & CLI
        run: cargo build --release --manifest-path rust-desktop/Cargo.toml

      - name: Run cross-platform self-test suite
        run: .\rust-desktop\target\release\audiomatrix-pc.exe self-test

      - name: Package Windows Release Zip
        run: |
          New-Item -ItemType Directory -Force -Path dist\win | Out-Null
          Copy-Item rust-desktop\target\release\audiomatrix-desktop.exe dist\win\
          Copy-Item rust-desktop\target\release\audiomatrix-pc.exe dist\win\
          Copy-Item README.md, README.zh-CN.md, LICENSE dist\win\
          Compress-Archive -Path dist\win\* -DestinationPath AudioMatrixHub-v2.0.0-Windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioMatrixHub-v2.0.0-Windows-x64
          path: AudioMatrixHub-v2.0.0-Windows-x64.zip

  macos-arm64:
    name: macOS (CoreAudio + SwiftUI FFI & Rust Desktop)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test & build Rust C-ABI Core
        run: |
          cargo test --release --manifest-path rust-core/Cargo.toml
          cargo build --release --manifest-path rust-core/Cargo.toml

      - name: Build SwiftUI + Rust FFI macOS targets
        run: swift build -c release

      - name: Run macOS CoreAudio + Rust FFI self-test suite
        run: ./.build/release/audiomatrix self-test
